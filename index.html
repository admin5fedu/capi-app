<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>Capi ERP - Quản trị doanh nghiệp thông minh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tải Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Cấu hình Tailwind trực tiếp để giữ nguyên giao diện
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              border: "hsl(214.3 31.8% 91.4%)",
              input: "hsl(214.3 31.8% 91.4%)",
              ring: "hsl(221.2 83.2% 53.3%)",
              background: "hsl(210 40% 98%)",
              foreground: "hsl(222.2 84% 4.9%)",
              primary: {
                DEFAULT: "hsl(221.2 83.2% 53.3%)",
                foreground: "hsl(210 40% 98%)",
                light: "hsl(221.2 83.2% 95%)",
              },
              secondary: {
                DEFAULT: "hsl(210 40% 96.1%)",
                foreground: "hsl(222.2 47.4% 11.2%)",
              },
              destructive: {
                DEFAULT: "hsl(0 84.2% 60.2%)",
                foreground: "hsl(210 40% 98%)",
              },
              muted: {
                DEFAULT: "hsl(210 40% 96.1%)",
                foreground: "hsl(215.4 16.3% 46.9%)",
              },
              accent: {
                DEFAULT: "hsl(221.2 83.2% 96%)",
                foreground: "hsl(222.2 47.4% 11.2%)",
              },
              card: {
                DEFAULT: "hsl(0 0% 100%)",
                foreground: "hsl(222.2 84% 4.9%)",
              },
              success: "hsl(142.1 76.2% 36.3%)",
              warning: "hsl(38 92% 50%)",
            },
            borderRadius: {
              'xl': "1rem",
              "2xl": "1.25rem",
              "3xl": "1.5rem",
              "4xl": "2rem",

            boxShadow: {
              'soft': '0 2px 15px -3px rgba(0,0,0,0.07), 0 4px 6px -2px rgba(0,0,0,0.02)',

              'primary-glow': '0 10px 25px -5px rgba(59, 130, 246, 0.2)',
            },
            fontFamily: {
              sans: ["'Plus Jakarta Sans'", "sans-serif"],
            },
            animation: {
              in: 'animate-in .5s ease-out',
            },
          },
        },
      }
